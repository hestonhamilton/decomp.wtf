# Lean CI backstop: the same pre-commit gate as the local hook, plus a full-history secret
# scan. Local pre-commit is the real gate; the main ruleset requires this job. One job, no
# matrix, superseded runs cancelled. Opt out with the template's `ci` question.
# Actions are pinned to full commit SHAs; Dependabot bumps the pins.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the gitleaks history scan
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install pre-commit
        run: uv tool install pre-commit==4.7.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit (all hooks, all files)
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Secret scan of full git history
        run: pre-commit run --hook-stage manual gitleaks-history --all-files
